worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.30.0.0/16;
    real_ip_recursive on;

    server {
        listen       80;
        server_name  dynamicdata.tech;
        root         /usr/share/nginx/html;
        
        # Indica a Nginx que busque index.html automáticamente en cualquier subcarpeta
        index        index.html index.htm;

        location / {
            # 1. $uri            -> Busca si es un archivo (ej: /logo.png)
            # 2. $uri/           -> Busca si es una carpeta y lee su index.html (ej: /about/ -> /about/index.html)
            # 3. /index.html     -> Si nada de lo anterior existe, va al index principal (Rutas SPA)
            try_files $uri $uri/ /index.html;
        }

        # Forzar que los archivos tengan los permisos correctos en caso de que Nginx se queje
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}