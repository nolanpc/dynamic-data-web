worker_processes auto;

events { worker_connections 1024; }

http {

    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.30.0.0/16;
    real_ip_recursive on;

    server {
        listen               80;
        #server_name         holananova.com;
        #ssl_certificate     holananova.crt;
        #ssl_certificate_key holananova.key;
        #ssl_protocols       TLSv1 TLSv1.1 TLSv1.2;
        #ssl_ciphers         HIGH:!aNULL:!MD5;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Servir index.html como archivo por defecto
        index index.html;

        # Si falta la ruta o hay 403/404, devolver la página principal (status 200)
        error_page 403 =200 /index.html;
        error_page 404 =200 /index.html;

        location / {
            try_files $uri $uri/ /index.html;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_set_header Content-Type $content_type;
            proxy_set_header Content-Length $content_length;
        }

    }
}