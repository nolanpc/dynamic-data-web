worker_processes auto;

events { 
    worker_connections 1024; 
}

http {
    # Incluye los tipos MIME para que el navegador reconozca correctamente los archivos CSS y JS
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Configuración para conservar la IP real de tus usuarios (útil si usas Cloudflare o Load Balancers)
    real_ip_header X-Forwarded-For;
    set_real_ip_from 172.30.0.0/16;
    real_ip_recursive on;

    server {
        listen       80;
        server_name  dynamicdata.tech;

        # La ruta en el contenedor donde tu Dockerfile copia los archivos estáticos
        root  /usr/share/nginx/html;
        
        # Archivo de entrada principal de tu aplicación
        index index.html;

        location / {
            # Busca el archivo solicitado. Si no existe (como pasa con /about/), 
            # le entrega el index.html principal para que el ruteo de tu App se encargue.
            # Se elimina '$uri/' para evitar que Nginx intente listar carpetas inexistentes (causa del 403).
            try_files $uri /index.html;
        }

        # Manejo de errores de servidor estándar
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}